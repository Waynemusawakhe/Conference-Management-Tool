<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f4; }
        .container { max-width: 600px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; }
        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-primary { background-color: #333; color: white; }
        .btn-danger { background-color: #dc3545; color: white; }
        .danger-zone { border-top: 2px solid #dc3545; margin-top: 30px; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Account Settings</h1>

        <!-- Update Password Form -->
        <form action="/api/account/password" method="POST">
            <h3>Change Password</h3>
            <div class="form-group">
                <label for="current_password">Current Password</label>
                <input type="password" id="current_password" name="current_password" required>
            </div>
            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" required>
            </div>
            <button type="submit" class="btn btn-primary">Update Password</button>
        </form>

        <!-- Delete Account Section -->
        <div class="danger-zone">
            <h3 style="color: #dc3545;">Delete Account</h3>
            <p>Once you delete your account, all your data will be permanently removed.</p>
            <form action="/api/account/delete" method="POST" onsubmit="return confirm('Are you sure you want to delete your account?');">
                <button type="submit" class="btn btn-danger">Delete My Account</button>
            </form>
        </div>
    </div>
</body>
</html>
